[project]
name = "ride-insight-ml"
version = "0.1.0"
description = "Data sampling, preprocessing and FTP-estimation experiments for ride-insight"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ride_insight_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# basetemp inside the project: the default %TEMP%\pytest-of-<user> can be owned by the Codex
# sandbox user and then be unreadable here (same issue as in voice-translator).
addopts = "-q --basetemp=.pytest-tmp"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
