distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 배포판 무결성 확인(2026-11-05 추가): wrapper는 배포판 zip을 새로 받을 때 이 SHA-256과 비교해, 다르면 설치하지 않고
# 실패한다(이미 풀어 둔 배포판은 다시 확인하지 않는다). 값은 Gradle이 공개한 gradle-9.7.1-bin.zip의 체크섬이다
# (services.gradle.org의 .sha256 파일과 gradle.org/release-checksums에서 같은 값을 확인했고, 실제로 받은 zip의 값도 같았다).
# distributionUrl의 판을 올리면 이 값도 그 판의 -bin 체크섬으로 함께 바꿔야 한다(`./gradlew wrapper --gradle-version <판>
# --gradle-distribution-sha256-sum <값>`). 잊으면 배포판을 새로 받는 곳(CI, Docker 이미지 빌드)에서 바로 실패로 드러난다.
distributionSha256Sum=acd53f1edaf02f1a8ff99879f8a34b302661a057d9b063ae9e35b552f804d20a
distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.1-bin.zip
networkTimeout=10000
retries=0
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
