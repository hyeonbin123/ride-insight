spring.application.name=ride-insight

# Database: the docker-compose support fills these in when running with ./gradlew bootRun;
# in other environments set the three variables.
spring.datasource.url=${RIDE_INSIGHT_DB_URL:jdbc:postgresql://localhost:55443/rideinsight}
spring.datasource.username=${RIDE_INSIGHT_DB_USER:rideinsight}
spring.datasource.password=${RIDE_INSIGHT_DB_PASSWORD:rideinsight}
spring.flyway.enabled=true
# float4(real) 열은 늘 텍스트로 받는다(2026-11-05). PgJDBC는 한 커넥션에서 같은 SQL을 prepareThreshold(기본 5)번 실행한
# 뒤부터 서버 쪽 prepared statement로 바꾸고 결과를 binary로 받는다. float4를 binary로 받으면 4바이트 값을 double로 넓혀
# 300.5867614746094처럼 긴 자릿수가 되고, 텍스트로 받으면 PostgreSQL이 보낸 짧은 표기(300.58676)를 읽는다. 그래서 같은 GET이
# 5번째까지와 6번째부터 다른 JSON을 돌려줬다(api/RepeatedReadsTest가 같은 요청 12번의 본문이 같은지 본다). FTP·시간대 변경 때
# 지표 재계산이 읽는 저장 NP·기록 간격도 같은 경로라, 다시 계산해 저장하는 IF·TSS의 끝자리가 그 커넥션의 실행 횟수에 따라
# 달라질 수 있었다.
# binaryTransferDisable(PgJDBC 속성, 쉼표로 나눈 형식 이름 또는 OID)로 float4와 float4 배열만 binary 전송에서 뺀다. 저장된 값은
# 그대로 float4이고 바뀌는 것은 읽은 Double의 자릿수뿐이다. 다른 형식(정수·시각·uuid 등)의 binary 전송과 prepared statement
# 재사용은 그대로다. 배열 열은 지금 SQL에서 ::text로 바꿔 읽어 이 설정과 무관하지만, 배열을 그대로 읽는 코드가 생겨도 전송
# 방식이 실행 횟수에 따라 바뀌지 않도록 함께 뺀다. Hikari가 드라이버 속성으로 넘기므로 이 설정 파일을 쓰는 서버와
# importOpenData 도구의 DataSource에 같이 적용된다.
spring.datasource.hikari.data-source-properties.binaryTransferDisable=FLOAT4,FLOAT4_ARRAY

# Uploads: one FIT file, 10 MB max (api.md)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
# Let Tomcat read (and discard) bodies up to this size after rejecting them, so a client that sends
# a slightly too large file receives the 413 instead of a dropped connection (Codex review 3).
server.tomcat.max-swallow-size=16MB
# 동시에 디코딩·저장하는 업로드 수와 차례를 기다리는 최대 시간(초). 넘으면 429 + Retry-After
# (service/UploadGate.kt, docs/experiments.md 규칙 변경 12).
ride-insight.upload.max-concurrent=2
ride-insight.upload.max-wait-seconds=30
# 선수 행 잠금(업로드 저장·FTP/시간대 변경·삭제를 선수마다 한 번에 하나씩 처리하는 select ... for update)을 기다리는 상한. Spring
# Duration 표기(5s, 500ms). 넘으면 409 athlete_busy + Retry-After(storage/AthleteRepository.lock, docs/api.md). 0이면 상한 없음.
# 업로드 대기 상한(위 max-wait-seconds)보다 짧아야 잠금에 막힌 업로드가 허가를 돌려준 뒤 다른 선수의 업로드가 들어갈 수 있다.
ride-insight.athlete-lock-timeout=5s
# Host 허용 목록(2026-10-29, api/HostAllowlistFilter.kt, docs/api.md). Host(포트 제외)가 이 목록에 없으면 421 host_not_allowed로
# 답한다. DNS rebinding으로 외부 페이지가 같은 출처로 이 API를 부르는 것을 막는다. 쉼표로 나누고 대소문자는 가리지 않는다.
# 다른 기기에서 보려면 그 주소를 더한다(compose에서는 환경 변수 RIDEINSIGHT_ALLOWEDHOSTS로 바꿀 수 있다).
ride-insight.allowed-hosts=localhost,127.0.0.1,[::1]

# 응답 압축(2026-10-29): Accept-Encoding에 gzip이 있으면 JSON 응답을 gzip으로 보낸다(라이딩 샘플은 최대 20,000점 × 6시리즈라
# 수백 KB). 이 서버는 JSON만 돌려주므로 형식은 application/json 하나로 둔다. 1 KB 미만(오류·선수 조회 등)은 줄어드는 바이트가
# gzip 머리와 CPU에 비해 작아 그대로 보낸다(web/nginx.conf의 gzip_min_length와 같은 값, 기본 2KB면 1~2 KB 응답이 빠진다).
# 이 하한은 Content-Length로 판단한다: Tomcat은 응답 버퍼(8 KB)에 다 들어간 응답에 길이를 붙이고, 버퍼를 넘는 응답은 길이를
# 모른 채(chunked) 보내므로 늘 압축한다. compose 스택에서는 nginx가 브라우저의 Accept-Encoding을 그대로 넘기므로 /api 응답도
# 여기서 압축된다.
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1KB

spring.jackson.default-property-inclusion=non_null
management.endpoints.web.exposure.include=health,info
