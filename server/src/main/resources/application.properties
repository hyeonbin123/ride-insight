spring.application.name=ride-insight

# Database: the docker-compose support fills these in when running with ./gradlew bootRun;
# in other environments set the three variables.
spring.datasource.url=${RIDE_INSIGHT_DB_URL:jdbc:postgresql://localhost:55443/rideinsight}
spring.datasource.username=${RIDE_INSIGHT_DB_USER:rideinsight}
spring.datasource.password=${RIDE_INSIGHT_DB_PASSWORD:rideinsight}
spring.flyway.enabled=true

# Uploads: one FIT file, 10 MB max (api.md)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
# Let Tomcat read (and discard) bodies up to this size after rejecting them, so a client that sends
# a slightly too large file receives the 413 instead of a dropped connection (Codex review 3).
server.tomcat.max-swallow-size=16MB
# 동시에 디코딩·저장하는 업로드 수와 차례를 기다리는 최대 시간(초). 넘으면 429 + Retry-After
# (service/UploadGate.kt, docs/experiments.md 규칙 변경 12).
ride-insight.upload.max-concurrent=2
ride-insight.upload.max-wait-seconds=30
# 선수 행 잠금(업로드 저장·FTP/시간대 변경·삭제를 선수마다 한 번에 하나씩 처리하는 select ... for update)을 기다리는 상한. Spring
# Duration 표기(5s, 500ms). 넘으면 409 athlete_busy + Retry-After(storage/AthleteRepository.lock, docs/api.md). 0이면 상한 없음.
# 업로드 대기 상한(위 max-wait-seconds)보다 짧아야 잠금에 막힌 업로드가 허가를 돌려준 뒤 다른 선수의 업로드가 들어갈 수 있다.
ride-insight.athlete-lock-timeout=5s

spring.jackson.default-property-inclusion=non_null
management.endpoints.web.exposure.include=health,info
