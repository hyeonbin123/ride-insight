spring.application.name=ride-insight

# Database: the docker-compose support fills these in when running with ./gradlew bootRun;
# in other environments set the three variables.
spring.datasource.url=${RIDE_INSIGHT_DB_URL:jdbc:postgresql://localhost:55443/rideinsight}
spring.datasource.username=${RIDE_INSIGHT_DB_USER:rideinsight}
spring.datasource.password=${RIDE_INSIGHT_DB_PASSWORD:rideinsight}
spring.flyway.enabled=true

# Uploads: one FIT file, 10 MB max (api.md)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
# Let Tomcat read (and discard) bodies up to this size after rejecting them, so a client that sends
# a slightly too large file receives the 413 instead of a dropped connection (Codex review 3).
server.tomcat.max-swallow-size=16MB

spring.jackson.default-property-inclusion=non_null
management.endpoints.web.exposure.include=health,info
