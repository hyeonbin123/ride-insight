# [파일 역할] web 이미지(nginx)의 사이트 설정. 빌드한 SPA(dist)를 서빙하고 /api/는 compose 안의 서버로 넘긴다.
# 공식 이미지의 /etc/nginx/nginx.conf가 http 블록 안에서 이 파일(conf.d/default.conf)을 읽으므로, server 블록 밖의
# 지시어(server_tokens, upstream)는 http 단계 설정이다.
# [보안 헤더, 2026-10-15] API 응답은 서버(SecurityHeadersFilter)가 헤더를 붙이고, 정적 화면에는 여기서 붙인다:
# nosniff, 프레임 금지, Referrer 보내지 않음, CSP. server_tokens off로 nginx 버전을 숨긴다. add_header는 location
# 안에 두어 /api/ 응답에 서버 헤더와 겹쳐 붙지 않게 했다.
# [CSP nonce] MUI(emotion)는 실행 중에 <style> 태그를 만든다. 처음에는 style-src 'unsafe-inline'으로 허용했는데 ZAP
# 전체 스택 스캔이 Medium 경보로 잡아, 요청마다 다른 nonce($request_id, 128비트 무작위)를 index.html의 자리 표시에
# 넣고(sub_filter, text/html만) 같은 값을 style-src에 적는다. 스크립트는 'self'만. HTML이 캐시되어 nonce가
# 재사용되지 않도록 no-cache로 둔다.
# [2026-10-29, 2026-10-19 코드 검토 반영] 베이스 이미지를 지원이 끝난 1.27에서 1.30 stable로 올리면서(web/Dockerfile)
# 네 가지를 더했다. (1) Host 검증: localhost·127.0.0.1이 아닌 Host는 아래 기본 서버가 응답 없이 끊는다(DNS rebinding 방지,
# 서버의 HostAllowlistFilter와 같은 규칙). (2) 응답 압축(gzip). (3) 이름에 해시가 붙은 /assets/ 번들은 1년 캐시(전에는
# index.html과 같은 no-cache라 로드마다 번들을 다시 확인했다). (4) 서버로 가는 연결 재사용(upstream keepalive).

# 버전 숨김은 http 단계에 둔다. Host가 맞지 않거나 요청 줄이 깨져 아래의 기본 서버가 오류(400 등)를 낼 때도 버전이
# 나가지 않게 하려는 것이다(전에는 server 블록이 하나라 그 안에 두어도 같았다).
server_tokens off;

# /api/를 받을 Spring Boot 서버(compose 서비스 이름 server). keepalive: nginx 작업자마다 놀고 있는 연결을 16개까지 남겨
# 두고 다음 요청에 다시 쓴다(전에는 요청마다 TCP 연결을 새로 열고 닫았다). keepalive_timeout은 Tomcat이 놀고 있는
# 연결을 닫기까지의 시간(서버 설정에서 바꾸지 않아 Tomcat 기본 60초)보다 짧게 두어, Tomcat이 막 닫은 연결에 nginx가
# 요청을 보내는 경합을 피한다.
upstream ride_insight_server {
    server server:8080;
    keepalive 16;
    keepalive_timeout 30s;
}

# 기본 서버: 아래 server_name에 없는 Host(DNS rebinding으로 들어온 외부 이름 등)와 Host가 없는 요청은 응답 없이 연결을
# 닫는다(444, nginx 전용 코드). 브라우저는 이 스택을 localhost나 127.0.0.1로 열었을 때만 화면과 /api/를 받는다.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    # 이 스택을 여는 이름(compose가 127.0.0.1:8081에만 연다). server_name 비교에 포트는 쓰이지 않는다. 다른 기기에서
    # 보려면 그 주소를 여기와 서버의 ride-insight.allowed-hosts에 함께 더해야 한다(compose.yaml 머리 주석).
    server_name localhost 127.0.0.1;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 12m;

    # 응답 압축. text/html은 nginx가 늘 압축 대상으로 보고, 여기에 JSON·JS·CSS·SVG를 더한다. gzip_min_length는
    # Content-Length를 아는 응답(정적 파일)에만 걸려 1 KB 미만은 그대로 보낸다. nonce를 넣는 HTML은 sub_filter가 길이를
    # 지워 크기와 상관없이 압축되고, 압축은 sub_filter 치환 뒤에 걸린다(nginx의 필터 순서는 고정이다).
    # gzip_vary: 캐시가 압축본과 원본을 나누도록 Vary: Accept-Encoding을 붙인다. gzip_proxied any: 앞에 다른 프록시가
    # 있어 Via 헤더가 붙은 요청에도 압축한다(브라우저가 직접 보낸 요청에는 영향 없음). /api/ 응답은 서버가 이미 gzip으로
    # 보내므로(server.compression) 그대로 넘어가고 다시 압축되지 않는다. HTML 안의 nonce는 요청마다 바뀌어 BREACH류(압축
    # 길이로 비밀값 추측)의 대상이 되지 않고, API 응답에는 인증 토큰 같은 비밀값이 없다.
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;

    location /api/ {
        proxy_pass http://ride_insight_server/api/;
        # keepalive 연결을 쓰려면 HTTP/1.1로 붙고 브라우저가 보낸 Connection 헤더를 지운다(nginx 기본은 HTTP/1.0 +
        # Connection: close라 요청마다 연결을 닫는다).
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # 서버는 Host 허용 목록을 본다(HostAllowlistFilter). $host는 브라우저가 쓴 이름(localhost·127.0.0.1, 포트 없음)이다.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # 빌드 산출물(Vite가 /assets/<이름>-<내용 해시>.js·css로 쓴다). 내용이 바뀌면 이름이 바뀌므로 1년 동안 다시 확인하지
    # 않게 한다(immutable). add_header는 그 단계에 add_header가 하나라도 있으면 위 단계에서 물려받지 않으므로 보안 헤더를
    # 여기에도 똑같이 적는다. Cache-Control만 always를 빼서 200·304에만 붙이고 404에는 붙이지 않는다(잠깐 없던 파일의
    # 404가 1년 동안 캐시되지 않게). 없는 파일은 index.html로 바꾸지 않고 404로 답한다(HTML이 JS 이름으로 캐시되지 않게).
    location ^~ /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$request_id'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$request_id'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-cache" always;
        sub_filter '__CSP_NONCE__' '$request_id';
        sub_filter_once on;
        try_files $uri /index.html;
    }
}
