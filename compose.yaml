# Whole stack: PostgreSQL + Kotlin server + nginx-served web. `docker compose up --build`, then open
# http://localhost:8081. The server alone is on http://localhost:8080.
# 포트는 이 PC(127.0.0.1)에만 연다(2026-10-15). API에 인증이 없어(README 한계) 모든 인터페이스에 열면 같은 네트워크의
# 누구나 선수 데이터를 읽고 쓸 수 있었다. 다른 기기에서 보려면 이 줄을 직접 바꿔야 한다.
# 2026-10-29부터 웹(nginx)과 서버는 Host가 이 PC의 이름일 때만 답한다(DNS rebinding 방지, docs/api.md): 웹은 localhost·
# 127.0.0.1이 아니면 응답 없이 연결을 닫고, 서버는 ride-insight.allowed-hosts(기본 localhost,127.0.0.1,[::1])에 없으면 421.
# 그래서 다른 기기에서 보려면 ports와 함께 web/nginx.conf의 server_name과 서버의 허용 목록(server 서비스 environment에
# RIDEINSIGHT_ALLOWEDHOSTS: "localhost,127.0.0.1,[::1],<그 주소>")에도 그 주소를 더해야 한다.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: rideinsight
      POSTGRES_USER: rideinsight
      POSTGRES_PASSWORD: rideinsight
    volumes:
      - ride-insight-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rideinsight -d rideinsight"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build: ./server
    # 메모리 한도(2026-10-15, docs/experiments.md 규칙 변경 12). 한도가 없으면 Docker 가상 머신 메모리의 75%까지 힙이 클 수
    # 있었다. 그때 이미지는 -XX:MaxRAMPercentage=75라 최대 힙이 약 576 MB(업로드 측정에 쓴 512 MB 힙과 비슷)였다.
    # 2026-10-30부터 이미지는 -XX:+UseSerialGC -XX:MaxRAMPercentage=60이라 이 한도에서 최대 힙이 462 MiB다(규칙 변경 17).
    # 이 한도 안에서 상한 가까운 업로드 동시 5개를 재 보니 75%에서는 컨테이너가 한도에 닿았고, 60%에서도 최대 728.5 MiB로
    # 미리 정한 기준(한도의 90%)을 넘었다(H13 기각, docs/experiments.md 5단계 'compose 스택의 서버 메모리'). 한도를 바꾸면
    # 최대 힙도 같은 비율로 바뀐다.
    # 운영 주의(2026-10-30): 처리 한도(기록 50만 개)에 가까운 큰 FIT를 여러 개 동시에 올리면(화면은 고른 파일을 하나씩
    # 차례로 올리므로 여러 탭이나 스크립트로 올릴 때) 이 컨테이너의 메모리가 한도 가까이 간다. 잰 PC는 Docker 가상 머신에
    # 스왑이 있어 강제 종료(OOM)가 없었지만, 스왑이 없는 호스트에서는 여유가 작다. 그런 곳에서는 큰 파일을 하나씩 올린다.
    # 한도 1 GiB, 업로드 동시 1개, MALLOC_ARENA_MAX 같은 다음 설정은 아직 재지 않았다(새 규칙을 먼저 등록한 뒤 잰다).
    mem_limit: 768m
    environment:
      RIDE_INSIGHT_DB_URL: jdbc:postgresql://postgres:5432/rideinsight
      RIDE_INSIGHT_DB_USER: rideinsight
      RIDE_INSIGHT_DB_PASSWORD: rideinsight
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build: ./web
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  ride-insight-pg:
