name: ci

on:
  push:
    branches: [main]
  pull_request:

# 액션 버전 (2026-10-15 갱신): GitHub가 러너에서 Node 20 액션 런타임을 걷어 내기로 해서
# (https://github.blog/changelog/2026-09-23-deprecation-of-node-20-on-github-actions-runners/)
# 모든 액션을 node24로 도는 주 버전으로 올렸다.
# - gradle/actions는 v6부터 캐시 기능이 MIT가 아닌 별도 약관(gradle-actions-caching)으로 바뀌어
#   약관 동의 없이 쓸 수 있는 마지막 주 버전 v5(node24)에 둔다.
# - astral-sh/setup-uv는 v8부터 주 버전 태그(@v8 등)를 내지 않아 불변 릴리스 태그로 고정한다.

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Tests (unit + Testcontainers PostgreSQL)
        working-directory: server
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Tests and lint
        working-directory: ml
        run: |
          uv sync --frozen
          uv run pytest
          uv run ruff check .
          uv run ruff format --check .

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # README·AGENTS의 화면 테스트 명령(lint → test → build)과 같은 순서로 돈다.
      # 2026-10-15 전에는 vitest가 CI에서 돌지 않아 화면 테스트 회귀를 잡지 못했다.
      - name: Lint, test and build
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
