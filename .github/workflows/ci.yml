name: ci

on:
  push:
    branches: [main]
  pull_request:

# 워크플로 토큰(GITHUB_TOKEN)은 저장소를 읽기만 한다(2026-10-29 추가). 저장소의 기본 권한도 지금은 읽기 전용이지만,
# 그 설정이 바뀌어도 이 워크플로가 쓰기 권한을 받지 않도록 여기에 적어 둔다. 어느 잡도 저장소·이슈·PR에 쓰지 않고
# 비밀값을 쓰지 않는다. 같은 이유로 체크아웃은 토큰을 .git 설정에 남기지 않는다(persist-credentials: false). checkout 뒤에
# git 인증이 필요한 단계가 없고, 뒤에서 도는 남의 코드(npm ci의 설치 스크립트, Gradle 플러그인, 내려받은 도구)가 읽을 수
# 있는 자격 증명을 줄인다.
permissions:
  contents: read

# 액션 버전 (2026-10-15 갱신): GitHub가 러너에서 Node 20 액션 런타임을 걷어 내기로 해서
# (https://github.blog/changelog/2026-09-23-deprecation-of-node-20-on-github-actions-runners/)
# 모든 액션을 node24로 도는 주 버전으로 올렸다.
# - gradle/actions는 v6부터 캐시 기능이 MIT가 아닌 별도 약관(gradle-actions-caching)으로 바뀌어
#   약관 동의 없이 쓸 수 있는 마지막 주 버전 v5(node24)에 둔다.
# - astral-sh/setup-uv는 v8부터 주 버전 태그(@v8 등)를 내지 않아 불변 릴리스 태그로 고정한다.
# - aquasecurity/trivy-action(2026-10-29 추가)은 태그가 아니라 커밋 SHA로 고정한다. 2026-03-19에 이 액션의 버전 태그
#   77개 중 76개가 자격 증명을 훔치는 커밋으로 강제 이동된 일이 있었다(GHSA-69fq-xp46-6x23). 고정한 커밋은 그 뒤에 나온
#   v0.36.0(서명이 확인되는 태그, master에 있는 커밋)이고, 이 액션이 안에서 부르는 setup-trivy도 안전한 판(v0.2.6)의
#   SHA로 고정돼 있다. 나머지 액션은 토큰이 읽기 전용이고 비밀값이 없어 태그로 둔다.

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Tests (unit + Testcontainers PostgreSQL)
        working-directory: server
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

  ml:
    runs-on: ubuntu-latest
    # Python 판 두 개(2026-10-29 추가). ml/uv.lock은 3.11과 3.12에 서로 다른 해석을 담고 있다(numpy 2.4.6 / 2.5.3,
    # scipy 1.17.1 / 1.18.1. numpy 2.5부터 3.11을 지원하지 않는다). 로컬 측정·테스트 환경은 3.11인데, 전에는 판을 정하지
    # 않아 CI가 러너의 시스템 Python 3.12로만 돌았고 측정 환경 쪽 해석은 검사되지 않았다. 둘 다 돌리고, 한쪽이 실패해도
    # 다른 쪽 결과를 볼 수 있게 fail-fast를 끈다. 3.11 쪽 로그에는 'Using CPython 3.11.x'와 '+ numpy==2.4.6'이 찍힌다.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          # 뒤 단계의 UV_PYTHON이 된다. 러너에 그 판이 없으면 uv가 관리형 CPython을 내려받는다.
          python-version: ${{ matrix.python }}
      - name: Tests and lint
        working-directory: ml
        run: |
          uv sync --frozen
          uv run pytest
          uv run ruff check .
          uv run ruff format --check .
      # 의존성 취약점 검사(2026-10-29 추가, 2026-11-07 대조 범위를 잠금 파일 전체로 넓힘). 잠금 파일에서 고정 버전 목록을
      # 내보내(모든 의존성 그룹, PyPI에 없는 프로젝트 자신은 뺀다) 판을 고정한 pip-audit로 PyPI의 권고와 대조하고, 알려진
      # 취약점이 하나라도 있으면 실패한다.
      # - --disable-pip: 목록을 그대로 읽는다. 이 옵션이 없으면 --no-deps를 줘도 임시 가상환경에서 pip의 설치 시험
      #   (--dry-run --report) 결과를 읽는데, 그 가상환경에 미리 깔리는 패키지(wheel이 끌어오는 packaging)와 같은 버전은
      #   결과에서 빠져 검사되지 않았다(pip-audit 2.10.1, 2026-10-29 로컬 확인). 설치 시험이 없어 몇 초면 끝난다.
      # - --strict: 검사하지 못한 패키지가 하나라도 있으면 통과시키지 않는다.
      # - 환경 표지 떼기(2026-11-07): 내보낸 줄에는 `; python_full_version < '3.12'`, `; sys_platform == 'win32'` 같은 환경
      #   표지가 붙는데, pip-audit는 표지를 자기를 돌리는 해석기 기준으로 판정해 맞지 않는 줄은 대조하지 않는다. 전에는 표지를
      #   그대로 둬서 이 Linux 잡이 판마다 잠금의 PyPI 패키지 23개 중 19개만 대조했고(3.11은 numpy 2.5.3·scipy 1.18.1을,
      #   3.12는 2.4.6·1.17.1을 건너뜀), Windows에서만 설치되는 colorama·tzdata는 어느 판에서도 대조되지 않았다(2026-11-05 확인,
      #   11-07 다시 확인). 표지를 떼면 러너·해석기와 상관없이 같은 목록, 곧 잠금의 PyPI 패키지 전부를 본다.
      # - 목록 나누기: 표지를 떼면 numpy·scipy처럼 Python 3.11과 3.12에서 판이 다른 패키지가 한 목록에 두 번 나오는데,
      #   pip-audit는 한 목록 안의 같은 이름을 받지 않으므로(duplicate requirements 오류) 둘째 판부터 다음 목록
      #   (ml-audit-2.txt …)으로 나눠 따로 대조한다. 이름은 PyPI 규칙대로 소문자로 바꾸고 `-`·`_`·`.`을 `-` 하나로 본다.
      # - shell: bash로 pipefail을 켠다(적지 않은 기본 셸은 `bash -e`뿐이라 파이프 앞쪽 명령이 실패해도 지나간다). 내보내기가
      #   실패하거나 grep이 한 줄도 고르지 못하면 이 단계가 실패해, 빈 목록을 대조하고 통과하는 일이 없다. 목록 하나가
      #   실패해도 다음 목록까지 대조해 로그에 남긴 뒤 끝에서 실패한다.
      # - 두 판의 잡이 같은 목록을 대조하는 것은 겹치지만(몇 초), 한쪽 판의 테스트가 실패해 이 단계를 건너뛰어도 다른 판의 잡에
      #   대조 결과가 남도록 그대로 둔다.
      # - 로컬에서 같은 대조를 하려면 아래 run의 명령을 ml 폴더의 Git Bash에서 RUNNER_TEMP를 빈 임시 폴더로, 해석기 판 자리를
      #   3.11로 바꿔 그대로 돌린다.
      - name: Dependency audit (pip-audit)
        working-directory: ml
        shell: bash
        run: |
          uv export --frozen --all-groups --format requirements-txt --no-hashes --no-emit-project > "$RUNNER_TEMP/ml-locked.txt"
          grep -E '^[A-Za-z0-9]' "$RUNNER_TEMP/ml-locked.txt" | sed -E 's/[[:space:]]*;.*$//' > "$RUNNER_TEMP/ml-pinned.txt"
          awk -F'==' -v dir="$RUNNER_TEMP" '{
            name = tolower($1); gsub(/[-_.]+/, "-", name)
            print > (dir "/ml-audit-" (++seen[name]) ".txt")
          }' "$RUNNER_TEMP/ml-pinned.txt"
          status=0
          for list in "$RUNNER_TEMP"/ml-audit-*.txt; do
            echo "== $(basename "$list"): $(wc -l < "$list") packages"
            uvx --python ${{ matrix.python }} pip-audit==2.10.1 -r "$list" --no-deps --disable-pip --strict --progress-spinner off || status=1
          done
          exit "$status"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # README·AGENTS의 화면 테스트 명령(lint → test → build)과 같은 순서로 돈다.
      # 2026-10-15 전에는 vitest가 CI에서 돌지 않아 화면 테스트 회귀를 잡지 못했다.
      - name: Lint, test and build
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      # 의존성 취약점 검사(2026-10-29 추가). package-lock.json 전체를 npm 레지스트리의 권고와 대조해 high 이상이 있으면
      # 실패한다. 화면 테스트·빌드에만 쓰는 개발 의존성도 본다: 2026-10-29에 jsdom이 끌어오는 undici의 high 권고가 CI가
      # 아니라 의존성 작업 중 따로 돌린 npm audit에서야 드러났다. lint·test·build 결과가 먼저 보이도록 마지막 단계에 둔다.
      - name: Dependency audit (npm audit)
        working-directory: web
        run: npm audit --audit-level=high

  # 서버·웹 Docker 이미지 취약점 검사(2026-10-29 추가). compose와 같은 Dockerfile로 이미지를 빌드해 Trivy로 OS 패키지와
  # 언어 패키지를 본다. 서버 이미지는 실행 jar(BOOT-INF/lib) 안의 Tomcat·Jackson 같은 라이브러리까지 잡는다(Gradle 쪽은
  # 잠금 파일이 없어 소스만 읽는 스캐너가 해석 버전을 모른다). 고친 버전이 나온 HIGH·CRITICAL이 하나라도 있으면 실패하고,
  # 고친 버전이 아직 없는 것은 세지 않는다(ignore-unfixed). 이 서비스에서 닿지 않는다고 확인한 것은 근거와 만료일을 붙여
  # .trivyignore에 둔다. 기본 검사 범위인 비밀값(secret) 탐지도 함께 돈다.
  # 주의: 취약점 DB와 베이스 이미지 태그(eclipse-temurin:21-jre, nginx:1.30-alpine)의 내용이 날마다 바뀌어 같은 커밋도
  # 다른 날 실패할 수 있다. 그때는 실패한 패키지가 다시 빌드한 베이스에서 고쳐지는지 보고, 닿지 않으면 .trivyignore에
  # 근거를 적는다.
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [server, web]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -t ride-insight-${{ matrix.image }}:ci ${{ matrix.image }}
      - name: Scan the image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ride-insight-${{ matrix.image }}:ci
          # 로컬에서 기준선을 잰 것과 같은 판(액션의 기본값 v0.70.0보다 새 판).
          version: v0.76.1
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

  # 전체 스택 스모크(2026-10-30 추가). README '실행'의 명령 그대로 compose로 PostgreSQL·서버·웹을 빌드해 띄우고, 웹(nginx,
  # 8081)을 거쳐 데모 시드 도구로 데모 선수를 만들고 샘플 FIT 9개를 올린다. 도구는 서버 통합 테스트의 완료 기준 2와 같은
  # 답(사이클링 5개 201, 러닝 422, 손상 2개 400 invalid_fit, Coros 201 또는 400)이 아니면 종료 코드 1로 실패한다. images 잡이
  # 이미지 안의 취약점을 본다면, 이 잡은 Dockerfile·nginx.conf·compose 설정·서버 실행 조건이 바뀌어 스택이 뜨지 않거나 /api
  # 프록시·업로드가 깨지는 회귀를 잡는다. images 잡과 따로 둔 것은 Trivy 결과(취약점 DB가 날마다 바뀜)와 이 결과가 서로를
  # 가리지 않게 하려는 것이다.
  # - --wait: healthcheck가 있는 postgres·server는 healthy, 없는 web은 running이 될 때까지 기다린다. 넘으면 실패.
  # - 마지막 단계의 `down --volumes`는 일회용 러너라서 쓴다. 로컬에서는 쓰지 않는다(DB 볼륨의 선수 데이터가 지워진다).
  #   로컬에서는 `docker compose stop`.
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          # 로컬 측정·테스트 환경과 같은 판. 데모 도구는 표준 라이브러리와 numpy만 쓰지만 같은 잠금 환경에서 돌린다.
          python-version: "3.11"
      - name: Start the stack (docker compose)
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Web page through nginx
        run: curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8081/
      - name: Demo seed through the web proxy (expected status codes)
        working-directory: ml
        run: uv run --frozen python -m ride_insight_ml.demo --target http://127.0.0.1:8081
      - name: Container logs (on failure)
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 200
      - name: Remove the stack
        if: always()
        run: docker compose down --volumes
